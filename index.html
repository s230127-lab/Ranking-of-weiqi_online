<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17251f">
  <meta name="description" content="weiqi_online 玩家排行榜">
  <title>圍棋排行榜 · Go Rankings</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18251f;
      --muted: #718078;
      --paper: #f4f2eb;
      --panel: #fffefa;
      --line: #e7e3d8;
      --green: #244b3b;
      --green-soft: #e8f0e9;
      --gold: #c49335;
      --shadow: 0 18px 55px rgba(37, 48, 39, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 4%, rgba(207, 187, 133, .18), transparent 28rem),
        var(--paper);
      color: var(--ink);
      font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "Noto Serif CJK TC", "Songti SC", Georgia, serif;
    }
    .shell { width: min(100% - 32px, 980px); margin: 0 auto; padding: 54px 0 70px; }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
    .eyebrow {
      margin: 0 0 11px; color: var(--green); font-size: .76rem; font-weight: 800;
      letter-spacing: .18em; text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(2.1rem, 6vw, 3.35rem); line-height: 1.05; letter-spacing: -.055em; }
    .subtitle { margin: 12px 0 0; color: var(--muted); font-size: .98rem; }
    .lang-button, .refresh-button {
      border: 1px solid var(--line); background: var(--panel); color: var(--ink);
      border-radius: 999px; padding: 10px 15px; font: inherit; font-size: .88rem;
      font-weight: 700; cursor: pointer; transition: .18s ease;
    }
    .lang-button:hover, .refresh-button:hover { border-color: #b8c6bb; transform: translateY(-1px); }
    .board-card {
      overflow: hidden; background: var(--panel); border: 1px solid var(--line);
      border-radius: 22px; box-shadow: var(--shadow);
    }
    .toolbar {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
      gap: 14px; padding: 18px 22px; border-bottom: 1px solid var(--line);
    }
    .tabs { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
    .tab {
      border: 1px solid transparent; border-radius: 999px; background: transparent;
      color: var(--muted); padding: 9px 13px; font: inherit; font-size: .88rem;
      font-weight: 750; cursor: pointer; transition: .18s ease;
    }
    .tab:hover { background: #f5f5ef; color: var(--ink); }
    .tab.active { background: var(--green); color: white; }
    .board-heading {
      display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
      padding: 24px 24px 17px;
    }
    h2 { margin: 0; font-size: 1.35rem; letter-spacing: -.025em; }
    .board-description { margin: 6px 0 0; color: var(--muted); font-size: .88rem; }
    .updated { color: var(--muted); font-size: .78rem; white-space: nowrap; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    thead { background: #f8f7f1; color: #829087; font-size: .72rem; letter-spacing: .11em; text-transform: uppercase; }
    th { padding: 13px 18px; font-weight: 800; white-space: nowrap; }
    th:first-child, td:first-child { padding-left: 25px; width: 76px; }
    th:last-child, td:last-child { padding-right: 25px; }
    td { padding: 16px 18px; border-top: 1px solid #efede5; font-size: .92rem; }
    tbody tr { transition: background .15s ease; }
    tbody tr:hover { background: #fbfaf5; }
    .rank {
      display: inline-flex; width: 30px; height: 30px; align-items: center; justify-content: center;
      border-radius: 50%; background: #f0efe9; color: #64736a; font-size: .82rem; font-weight: 850;
      font-variant-numeric: tabular-nums;
    }
    .rank.first { background: #f4e8c8; color: #8b641b; }
    .rank.second { background: #e8e9e5; color: #606a63; }
    .rank.third { background: #f0e2d7; color: #8b5c3c; }
    .player { display: flex; align-items: center; gap: 11px; min-width: 170px; }
    .avatar {
      display: grid; place-items: center; flex: 0 0 34px; width: 34px; height: 34px;
      border-radius: 50%; background: var(--green-soft); color: var(--green); font-size: .83rem; font-weight: 850;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .player-name { font-weight: 780; overflow-wrap: anywhere; }
    .metric { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .points { color: var(--green); font-weight: 850; }
    .muted { color: var(--muted); }
    .record { color: #4c5b52; font-size: .86rem; white-space: nowrap; }
    .board-size {
      display: inline-flex; align-items: center; border-radius: 999px; padding: 5px 9px;
      background: #f1f1eb; color: #68756c; font-size: .78rem; font-weight: 750;
    }
    .message { padding: 58px 20px; text-align: center; color: var(--muted); }
    .message strong { display: block; margin-bottom: 7px; color: var(--ink); font-size: 1rem; }
    .message p { margin: 0; font-size: .88rem; line-height: 1.6; }
    .spinner {
      width: 22px; height: 22px; margin: 0 auto 13px; border: 2px solid #e5e8e0;
      border-top-color: var(--green); border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer { padding-top: 17px; text-align: center; color: #929c94; font-size: .76rem; }
    @media (max-width: 620px) {
      .shell { width: min(100% - 22px, 980px); padding-top: 32px; }
      header { margin-bottom: 20px; }
      .toolbar { padding: 14px; }
      .tabs { gap: 4px; }
      .tab { padding: 8px 10px; font-size: .82rem; }
      .board-heading { padding: 21px 17px 15px; }
      th { padding: 12px 13px; }
      td { padding: 14px 13px; }
      th:first-child, td:first-child { padding-left: 16px; }
      th:last-child, td:last-child { padding-right: 16px; }
      .updated { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow" id="eyebrow">WEIQI ONLINE · PLAYER STANDINGS</p>
        <h1 id="pageTitle">圍棋排行榜</h1>
        <p class="subtitle" id="pageSubtitle">玩家成績與各級最快紀錄</p>
      </div>
      <button class="lang-button" id="languageButton" type="button">English</button>
    </header>

    <section class="board-card" aria-labelledby="boardTitle">
      <div class="toolbar">
        <nav class="tabs" id="tabs" aria-label="排行榜類別">
          <button class="tab active" type="button">總排行榜</button>
        </nav>
        <button class="refresh-button" id="refreshButton" type="button">重新整理</button>
      </div>

      <div class="board-heading">
        <div>
          <h2 id="boardTitle">總排行榜 · 前 10 名</h2>
          <p class="board-description" id="boardDescription">依積分排名，勝局 3 分、和局 1 分。</p>
        </div>
        <span class="updated" id="updatedAt"></span>
      </div>

      <div id="results" aria-live="polite">
        <div class="message"><div class="spinner"></div><strong>正在載入排行榜</strong><p>正在連接排行榜資料。</p></div>
      </div>
    </section>
    <footer id="footerText">排行榜資料來自 weiqi_online</footer>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script>
    (() => {
      "use strict";

      const firebaseConfig = {
        apiKey: "AIzaSyBOcBPN-D8S4-4lJ6LwzGcBV-N4CI60bdzI",
        authDomain: "weiqi-online.firebaseapp.com",
        projectId: "weiqi-online",
        storageBucket: "weiqi-online.firebasestorage.app",
        messagingSenderId: "950011884276",
        appId: "1:950011884276:web:2241c6311e1ee79b1424a1",
        measurementId: "G-J5J6K8H61M"
      };

      const copy = {
        zh: {
          eyebrow: "WEIQI ONLINE · PLAYER STANDINGS",
          title: "圍棋排行榜",
          subtitle: "玩家成績與各級最快紀錄",
          overall: "總排行榜",
          refresh: "重新整理",
          updated: "更新時間：{time}",
          overallTitle: "總排行榜 · 前 10 名",
          overallDescription: "依積分排名，勝局 3 分、和局 1 分。",
          rank: "排名",
          player: "玩家",
          points: "積分",
          results: "勝／敗／和",
          noOverall: "目前還沒有排名紀錄。",
          loading: "正在載入排行榜",
          connecting: "正在連接排行榜資料。",
          error: "無法載入排行榜",
          errorText: "請確認 Firebase 設定、網路連線及 Firestore 公開讀取規則。",
          fallback: "圍棋玩家",
          footer: "排行榜資料來自 weiqi_online",
          seconds: "秒"
        },
        en: {
          eyebrow: "WEIQI ONLINE · PLAYER STANDINGS",
          title: "Go Rankings",
          subtitle: "Player standings and fastest wins by level",
          overall: "Overall",
          refresh: "Refresh",
          updated: "Updated: {time}",
          overallTitle: "Overall Ranking · Top 10",
          overallDescription: "Ranked by points: 3 for a win and 1 for a draw.",
          rank: "Rank",
          player: "Player",
          points: "Points",
          results: "W / L / D",
          noOverall: "There are no ranking records yet.",
          loading: "Loading rankings",
          connecting: "Connecting to leaderboard data.",
          error: "Could not load rankings",
          errorText: "Check the Firebase configuration, network connection and Firestore public read rules.",
          fallback: "Go player",
          footer: "Ranking data from weiqi_online",
          seconds: "s"
        }
      };

      const $ = (id) => document.getElementById(id);
      let language = "zh";
      let activeBoard = "overall";
      let db = null;
      let requestNumber = 0;

      function t(key, values) {
        let value = (copy[language] || copy.zh)[key];
        Object.entries(values || {}).forEach(([name, item]) => {
          value = value.replaceAll("{" + name + "}", String(item));
        });
        return value;
      }

      function setMessage(title, description, loading) {
        const wrapper = document.createElement("div");
        wrapper.className = "message";
        if (loading) {
          const spinner = document.createElement("div");
          spinner.className = "spinner";
          wrapper.appendChild(spinner);
        }
        const heading = document.createElement("strong");
        heading.textContent = title;
        const detail = document.createElement("p");
        detail.textContent = description;
        wrapper.append(heading, detail);
        $("results").replaceChildren(wrapper);
      }

      function formatDuration(ms) {
        const totalSeconds = Math.max(0, Math.floor(Number(ms) / 1000));
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        if (hours) return hours + ":" + String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0");
        return minutes + ":" + String(seconds).padStart(2, "0");
      }

      function rankBadge(index) {
        const span = document.createElement("span");
        span.className = "rank" + (index < 3 ? [" first", " second", " third"][index] : "");
        span.textContent = String(index + 1);
        return span;
      }

      function playerCell(entry) {
        const wrap = document.createElement("div");
        wrap.className = "player";
        const avatar = document.createElement("span");
        avatar.className = "avatar";
        const displayName = String(entry.displayName || t("fallback")).slice(0, 80);
        avatar.textContent = Array.from(displayName.trim())[0] || "?";
        if (entry.photoURL && /^https:\/\/.+/i.test(entry.photoURL)) {
          const img = document.createElement("img");
          img.src = entry.photoURL;
          img.alt = "";
          img.referrerPolicy = "no-referrer";
          img.onerror = () => { img.remove(); };
          avatar.replaceChildren(img);
        }
        const name = document.createElement("span");
        name.className = "player-name";
        name.textContent = displayName;
        wrap.append(avatar, name);
        return wrap;
      }

      function cell(text, className) {
        const td = document.createElement("td");
        if (className) td.className = className;
        td.textContent = text;
        return td;
      }

      function makeTable(headers, entries, rowBuilder) {
        const wrapper = document.createElement("div");
        wrapper.className = "table-wrap";
        const table = document.createElement("table");
        const thead = document.createElement("thead");
        const headerRow = document.createElement("tr");
        headers.forEach((label) => {
          const th = document.createElement("th");
          th.textContent = label;
          headerRow.appendChild(th);
        });
        thead.appendChild(headerRow);
        const tbody = document.createElement("tbody");
        entries.forEach((entry, index) => {
          const tr = document.createElement("tr");
          tr.appendChild(cell(""));
          tr.lastChild.appendChild(rankBadge(index));
          rowBuilder(tr, entry);
          tbody.appendChild(tr);
        });
        table.append(thead, tbody);
        wrapper.appendChild(table);
        $("results").replaceChildren(wrapper);
      }

      function renderOverall(snapshot) {
        const entries = snapshot.docs.map((doc) => doc.data());
        entries.sort((a, b) =>
          (Number(b.points) || 0) - (Number(a.points) || 0) ||
          (Number(b.wins) || 0) - (Number(a.wins) || 0) ||
          ((Number(b.wins) || 0) / Math.max(1, Number(b.games) || 0)) -
            ((Number(a.wins) || 0) / Math.max(1, Number(a.games) || 0)) ||
          String(a.displayName || "").localeCompare(String(b.displayName || ""))
        );
        const top = entries.slice(0, 10);
        if (!top.length) {
          setMessage(t("noOverall"), "", false);
          return;
        }
        makeTable([t("rank"), t("player"), t("points"), t("results")], top, (tr, entry) => {
          tr.append(
            (() => { const td = document.createElement("td"); td.appendChild(playerCell(entry)); return td; })(),
            cell(String(Number(entry.points) || 0), "metric points"),
            cell(
              (Number(entry.wins) || 0) + " / " +
              (Number(entry.losses) || 0) + " / " +
              (Number(entry.draws) || 0),
              "record metric"
            )
          );
        });
      }

      function updateLabels() {
        $("eyebrow").textContent = t("eyebrow");
        $("pageTitle").textContent = t("title");
        $("pageSubtitle").textContent = t("subtitle");
        $("languageButton").textContent = language === "zh" ? "English" : "繁體中文";
        $("refreshButton").textContent = t("refresh");
        $("footerText").textContent = t("footer");
        document.documentElement.lang = language === "zh" ? "zh-Hant" : "en";
        $("boardTitle").textContent = t("overallTitle");
        $("boardDescription").textContent = t("overallDescription");
      }

      async function loadBoard() {
        const currentRequest = ++requestNumber;
        updateLabels();
        $("updatedAt").textContent = "";
        setMessage(t("loading"), t("connecting"), true);
        try {
          if (!db) throw new Error("Firestore is not initialised.");
          const snapshot = await db.collection("leaderboard")
            .orderBy("points", "desc")
            .limit(100)
            .get();
          if (currentRequest !== requestNumber) return;
          renderOverall(snapshot);
          $("updatedAt").textContent = t("updated", {
            time: new Intl.DateTimeFormat(language === "zh" ? "zh-TW" : "en-GB", {
              hour: "2-digit", minute: "2-digit", second: "2-digit"
            }).format(new Date())
          });
        } catch (error) {
          console.error("Could not load leaderboard:", error);
          if (currentRequest !== requestNumber) return;
          setMessage(t("error"), t("errorText"), false);
        }
      }

      function start() {
        try {
          if (!window.firebase || !window.firebase.firestore) {
            throw new Error("Firebase SDK failed to load.");
          }
          if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
          db = firebase.firestore();
          updateLabels();
          loadBoard();
        } catch (error) {
          console.error("Firebase initialisation failed:", error);
          updateLabels();
          setMessage(t("error"), t("errorText"), false);
        }
      }

      $("refreshButton").addEventListener("click", loadBoard);
      $("languageButton").addEventListener("click", () => {
        language = language === "zh" ? "en" : "zh";
        updateLabels();
        loadBoard();
      });

      start();
      window.setInterval(loadBoard, 60000);
    })();
  </script>
</body>
</html>
